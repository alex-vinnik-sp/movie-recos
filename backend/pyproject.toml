[project]
name = "movie-recos-backend"
version = "0.1.0"
description = "Movie recommendation backend with LangGraph agent, A2A, and MCP servers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.0.3",
    "langchain>=1.1.0",
    "langchain-aws>=1.1.0",
    "langchain-core>=1.1.0",
    "boto3>=1.34.0",
    "trulens-core>=2.5.1",
    "trulens-connectors-snowflake>=2.5.1",
    "trulens-apps-langgraph>=2.5.1",
    "trulens-benchmark>=2.5.1",
    "trulens-providers-bedrock>=2.5.1",
    "trulens-providers-cortex>=2.5.1",
    "tqdm>=4.66.0",
    "snowflake-connector-python[pandas,secure-local-storage]>=3.0.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
