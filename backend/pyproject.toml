[project]
name = "movie-recos-backend"
version = "0.1.0"
description = "Movie recommendation backend with LangGraph agent, A2A, and MCP servers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.0.5",
    "langchain>=1.2.0",
    "langchain-aws>=1.1.0",
    "boto3>=1.34.0",
    "langchain-core>=1.2.5",
    "langsmith>=0.5.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "mcp>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "langsmith[pytest]>=0.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "langsmith: marks tests as LangSmith tracked tests",
]
