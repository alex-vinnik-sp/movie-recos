[project]
name = "movie-recos-backend"
version = "0.1.0"
description = "Movie recommendation backend with LangGraph agent, A2A, and MCP servers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.0.3",
    "langchain>=1.1.0",
    "langchain-aws>=1.1.0",
    "langchain-core>=1.1.0",
    "boto3>=1.34.0",
    "tqdm>=4.66.0",
    "snowflake-connector-python[pandas,secure-local-storage]>=3.0.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "mcp>=1.0.0",
    "trulens-core",
    "trulens-feedback",
    "trulens-connectors-snowflake",
    "trulens-apps-langgraph",
    "trulens-benchmark",
    "trulens-providers-bedrock",
    "trulens-providers-cortex",
    "trulens-eval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
trulens-core = { path = "../../../projects/truera/trulens/src/core", editable = true }
trulens-feedback = { path = "../../../projects/truera/trulens/src/feedback", editable = true }
trulens-connectors-snowflake = { path = "../../../projects/truera/trulens/src/connectors/snowflake", editable = true }
trulens-apps-langgraph = { path = "../../../projects/truera/trulens/src/apps/langgraph", editable = true }
trulens-benchmark = { path = "../../../projects/truera/trulens/src/benchmark", editable = true }
trulens-providers-bedrock = { path = "../../../projects/truera/trulens/src/providers/bedrock", editable = true }
trulens-providers-cortex = { path = "../../../projects/truera/trulens/src/providers/cortex", editable = true }
trulens-eval = { path = "../../../projects/truera/trulens/src/trulens_eval", editable = true }

[dependency-groups]
dev = []
